<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages of an accountable coding run: goal, context, tool call, anchored edit, ledger, check, bisect, certificate. The goal is pinned as the first row of a hash-chained ledger. Project conventions and a bounded repo map fold into the prompt verbatim. Every tool call is permission-checked before it runs, and an anchored edit that does not match exactly once writes nothing. The acceptance check runs outside anything the model can call. A bisect replays the recorded edits until the check goes red, naming the first breaking edit. The certificate is a few kilobytes and re-derives with no model and no network. Three outcomes: allow, refuted, and unverifiable."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">ONE RUN, HANDED TO A STRANGER</text><text class="h" x="44" y="72">How a coding run becomes something you can check without trusting it</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M592.25 398V420H367.75V405"/><text class="k" x="480" y="437" text-anchor="middle" fill="var(--drift)">THE CHECK RUNS AGAIN ON EACH REPLAYED EDIT</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Goal</text><text class="s" x="58" y="168">The task, pinned as the first</text><text class="s" x="58" y="183">row of the ledger.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Context</text><text class="s" x="282.5" y="168">Your conventions file and a</text><text class="s" x="282.5" y="183">bounded repo map, verbatim.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Tool call</text><text class="s" x="507" y="168">The model proposes; permission</text><text class="s" x="507" y="183">is checked before it runs.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Anchored edit</text><text class="s" x="731.5" y="168">The target must match once, or</text><text class="s" x="731.5" y="183">nothing is written.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Ledger</text><text class="s" x="58" y="360">Every turn, call, and result</text><text class="s" x="58" y="375">appends to a hash chain.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Check</text><text class="s" x="282.5" y="360">Your acceptance command,</text><text class="s" x="282.5" y="375">outside anything the model can</text><text class="s" x="282.5" y="390">call.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Bisect</text><text class="s" x="507" y="360">Replay the recorded edits</text><text class="s" x="507" y="375">until the check goes red.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Certificate</text><text class="s" x="731.5" y="360">A few kilobytes, re-derived</text><text class="s" x="731.5" y="375">with no model and no network.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">ALLOW</text><text class="s" x="58" y="509" font-size="10.5">chain intact, receipts re-derive, contract met</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">REFUTED</text><text class="s" x="357.33" y="509" font-size="10.5">a broken chain, or a claim the record denies</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">UNVERIFIABLE</text><text class="s" x="656.67" y="509" font-size="10.5">a clause this verifier cannot re-derive</text><text class="s" x="44" y="546">Refuted outranks unverifiable, and both outrank allow. A doubt is never a pass.</text></svg>
